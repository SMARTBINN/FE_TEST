<div class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-900 to-green-950 flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-2">
        <div class="bg-green-500 p-2.5 rounded-xl">
          <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </div>
        <span class="text-2xl font-extrabold text-white">BIOLOOP</span>
      </a>
      <p class="text-gray-400 mt-3 text-sm">Connectez-vous à votre espace</p>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-2">Connexion</h2>
      <p class="text-gray-500 text-sm mb-8">Accédez à votre tableau de bord</p>

      <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-xl mb-5">
        Identifiants incorrects. Réessayez.
      </div>

      <form (ngSubmit)="login()" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nom d'utilisateur</label>
          <input type="text" [(ngModel)]="credentials.username" name="username" required
            placeholder="admin"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"/>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Mot de passe</label>
          <input type="password" [(ngModel)]="credentials.password" name="password" required
            placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"/>
        </div>
        <button type="submit" [disabled]="loading"
          class="w-full bg-green-600 text-white py-3.5 rounded-xl font-semibold hover:bg-green-700 transition-colors disabled:opacity-60 flex items-center justify-center gap-2 cursor-pointer">
          <svg *ngIf="loading" class="h-5 w-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-gray-100 text-center">
        <a routerLink="/" class="text-sm text-gray-400 hover:text-green-600 transition-colors cursor-pointer">
          ← Retour au site
        </a>
      </div>
    </div>

    <p class="text-center text-gray-600 text-xs mt-6">© 2026 BIOLOOP. Tous droits réservés.</p>
  </div>
</div>
